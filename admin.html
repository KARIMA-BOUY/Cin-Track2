<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
<body class="bg-black text-white ">
    <header class="bg-black border-b border-slate-800 py-6 px-10 flex justify-between items-center">
       <h1 class="text-4xl font-bold text-red-600 tracking-wider">CinéTrack</h1>  
        <a href="index.html" class="bg-red-600 px-5 py-2 rounded-lg">Accueil</a>
    </header>
   <form id="content-form" class="max-w-lg mx-auto my-8 bg-slate-900/90 border border-slate-700/70 p-6 rounded-2xl shadow-2xl space-y-4 text-slate-200">

    <div class="border-b border-slate-700/70 pb-3 mb-4">
        <h2 id="form-title" class="text-xl font-bold text-white tracking-wide flex items-center gap-2">
            <span class="w-1.5 h-6 bg-red-600 rounded-full inline-block"></span>
            Ajouter un contenu
        </h2>
    </div>
    <div>
        <label for="title" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Titre</label>
        <input type="text" id="title" placeholder="Ex: Inception"
            class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
        <p id="title-error" class="text-red-400 text-xs mt-1"></p>
    </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label for="type" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Type</label>
            <select id="type"
                class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
                <option value="">Choisir...</option>
                <option value="film">Film</option>
                <option value="serie">Série</option>
            </select>
            <!-- <p id="type-error" class="text-red-400 text-xs mt-1"></p> -->
        </div>
        <div>
            <label for="year" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Année</label>
            <input type="number" id="year" placeholder="2024"
                class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
            <p id="year-error" class="text-red-400 text-xs mt-1"></p>
        </div>
    </div>
    <div>
        <label for="Image" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Image URL</label>
        <input type="text" id="Image" placeholder="https://..."
            class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
        <p id="image-error" class="text-red-400 text-xs mt-1"></p>
    </div>
    <div>
        <label for="genres" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Genres (séparés par des virgules)</label>
        <input type="text" id="genres" placeholder="Action, Sci-Fi, Thriller"
            class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label for="duration" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Durée (film - min)</label>
            <input type="number" id="duration" placeholder="148"
                class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
            <p id="duration-error" class="text-red-400 text-xs mt-1"></p>
        </div>

        <div>
            <label for="seasons" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Saisons (série)</label>
            <input type="number" id="seasons" placeholder="3"
                class="w-full px-3.5 py-2 text-sm bg-slate-800 border border-slate-700 text-white rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition">
            <p id="seasons-error" class="text-red-400 text-xs mt-1"></p>
        </div>
    </div>
    <div class="pt-2">
        <button type="submit" id="submit-btn"
            class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-semibold py-2.5 px-5 rounded-lg shadow-lg shadow-red-600/20 transition cursor-pointer">
            Ajouter
        </button>
    </div>
</form>
    </form>
    <main class="p-8">
        <h2 class="text-2xl font-bold mb-6">Administrations des films et series</h2>
        <p id="message" class="text-slate-400 mb-4"></p>
        <div class="overflow-x-auto">
            <table class="w-full text-left border border-slate-700">
                <thead class="bg-slate-800">
                    <th class="p-3">Image</th>
                     <th class="p-3">titre</th>
                      <th class="p-3">Type</th>
                       <th class="p-3">Annee</th>
                       <th class="p-3">actions</th>
                </thead>
            <tbody id="content-table"></tbody>
            </table>
        </div>
    </main>

<script type="module" src="./js/admin.js"></script>

    
</body>
</html>
